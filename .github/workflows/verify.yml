name: Verify Stocklumo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: dotnet test MarketDesk.slnx -c Release
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - run: dotnet list MarketDesk.slnx package --vulnerable --include-transitive
